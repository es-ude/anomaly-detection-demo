[project]
name = "demo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
  { name = "Julian Hoever", email = "julianhoever@posteo.de" },
  { name = "Florian Hettstedt", email = "florian.hettstedt@uni-due.de" },
  { name = "David P. Federl", email = "david-peter.federl@uni-due.de" }
]
dependencies = [
  "ipywidgets>=8.1.5",
  "jupyterlab>=4.3.5",
  "marimo>=0.15.0",
  "matplotlib>=3.10.0",
  "nicegui>=2.12.1",
  "numpy<2",
  "opencv-python>=4.11.0.86",
  "pandas>=2.2.3",
  "pillow>=11.1.0",
  "plotly>=6.3.0",
  "scikit-learn>=1.7.1",
  "torch",
  "torchsummary>=1.5.1",
  "torchvision",
  "typer>=0.21.1",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "mypy>=1.15.0",
  "pynvim>=0.5.2",
  "pytest>=8.3.4",
  "python-lsp-server>=1.12.2",
  "rope>=1.13.0",
  "ruff>=0.9.7",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
dotenv = [".env", ".env.testing"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.uv.sources]
torch = [
  { index = "pytorch", marker = "sys_platform == 'darwin'" },
  { index = "jetson-ai-lab", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch", marker = "sys_platform == 'darwin'" },
  { index = "jetson-ai-lab", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/"
explicit = true

[[tool.uv.index]]
name = "jetson-ai-lab"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true
